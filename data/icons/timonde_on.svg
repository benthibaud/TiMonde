    <path d="M19 2.5 C20.5 4 20.5 6 19 7.5" stroke="#00e676" stroke-width="1.8"/>
    <path d="M21 1 C23.5 3.5 23.5 8 21 10.5" stroke="#00e676" stroke-width="1.8" opacity="0.8"/>
    <!-- Antenne -->
    <path d="M5.5 5.5 L15 2" stroke="#ffffff" stroke-width="1.7"/>
