    <line x1="13.5" y1="10" x2="17" y2="10" stroke="#00e676" stroke-width="1.6"/>
    <line x1="13.5" y1="12.8" x2="17" y2="12.8" stroke="#ffffff" stroke-width="1.6"/>
    <circle cx="15.2" cy="15.8" r="1.2" fill="#00e676"/>
